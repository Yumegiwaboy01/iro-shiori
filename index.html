<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ed"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>色の栞</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ed;color:#44463f;font-family:Georgia,'Yu Mincho',serif}main{max-width:600px;margin:auto;padding:32px 20px}h1{text-align:center;letter-spacing:.18em;font-weight:normal;margin:0}p.sub{text-align:center;color:#89877d;font-size:13px;margin-bottom:28px}button,label.pick{display:block;width:100%;padding:14px;margin:12px 0;border:1px solid #a6a89c;border-radius:6px;background:transparent;color:inherit;font:inherit;text-align:center;cursor:pointer}button.primary{background:#34494d;color:white;border:0}button:disabled{opacity:.4}#photo,#output{width:100%;object-fit:contain;max-height:500px}#empty{padding:50px 10px;border:1px dashed #aaa;text-align:center;color:#89877d}#palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:20px 0}.sw{height:100px;border-radius:5px}input.name{width:100%;border:0;border-bottom:1px solid #ccc;background:transparent;color:inherit;font:inherit;font-size:12px;padding:8px 0}.meta{font-size:10px;overflow-wrap:anywhere;color:#777}#status{font-size:12px;text-align:center}footer{text-align:right;font-size:11px;color:#888;letter-spacing:.1em}h2{font-weight:normal;margin-bottom:4px}</style><main><h1>色の栞</h1><p class="sub">日常を、5つの色で残す。</p><div id="empty">写真を選ぶと、ここに表示されます。</div><img id="photo" hidden><h2 id="date"></h2><div class="meta">Colors of the day</div><div id="palette"></div><label class="pick">＋ 写真を選択<input id="file" type="file" accept="image/*" hidden></label><button id="again" disabled>色を再抽出する</button><button id="save" class="primary" disabled>保存用画像を作る</button><button id="share" hidden>画像を共有・保存する</button><a id="download" hidden download="iro-no-shiori.png">PNGをダウンロード</a><p id="status" role="status"></p><img id="output" hidden><footer>IRO NO SHIORI</footer></main><script>
const $=x=>document.getElementById(x), names=[['雪白','Snow White','f6f5f0'],['生成り','Ivory','e7dfce'],['銀灰','Silver Gray','b8b9b6'],['鼠色','Ash Gray','898b89'],['墨色','Ink Black','333536'],['漆黒','Jet Black','151718'],['青灰','Blue Gray','a8bdc1'],['水色','Sky Blue','89c3eb'],['青磁色','Celadon','7ebea5'],['深海色','Deep Sea','25383e'],['藍色','Indigo','26466d'],['紺色','Navy','222c4e'],['群青','Ultramarine','4059ad'],['藤色','Wisteria','a394c5'],['紫苑色','Aster','80639b'],['桜色','Cherry Blossom','f2c9ce'],['桃色','Peach Pink','e0bca9'],['茜色','Madder Red','a52d43'],['朱色','Vermilion','d94b32'],['橙色','Orange','ed922d'],['山吹色','Golden Yellow','e7b52c'],['麦色','Wheat','c8b582'],['砂色','Sand','c9ab99'],['胡桃色','Walnut','92745e'],['焦茶','Dark Brown','50382d'],['若草色','Young Grass','a8c76a'],['抹茶色','Matcha','89945a'],['苔色','Moss','68774c'],['深緑','Forest Green','305b43'],['青緑','Teal','408d8c']];const rgb=h=>h.replace('#','').match(/../g).map(x=>parseInt(x,16)),dist=(a,b)=>a.reduce((s,x,i)=>s+(x-b[i])**2,0),hex=a=>'#'+a.map(x=>Math.round(x).toString(16).padStart(2,'0')).join('').toUpperCase();function color(h){let n=names.reduce((a,b)=>dist(rgb(h),rgb(b[2]))<dist(rgb(h),rgb(a[2]))?b:a);return {h,n:n[0],e:n[1]}}let colors=['#D3D5C9','#A8BDC1','#9AAFB0','#8DA09D','#25383E'].map(color),blob,url;let d=new Date();$('date').textContent=`${d.getMonth()+1}月${d.getDate()}日`;function invalidate(){$('output').hidden=$('share').hidden=$('download').hidden=true;blob=null}function render(){$('palette').replaceChildren();colors.forEach(c=>{let el=document.createElement('div'),s=document.createElement('div'),n=document.createElement('input'),m=document.createElement('div');s.className='sw';s.style.background=c.h;n.className='name';n.value=c.n;n.oninput=()=>{c.n=n.value;invalidate()};m.className='meta';m.textContent=c.e+' '+c.h;s.onclick=m.onclick=async()=>{try{await navigator.clipboard.writeText(c.h);$('status').textContent='コピーしました：'+c.h}catch{$('status').textContent=c.h}};el.append(s,n,m);$('palette').append(el)})}function extract(){invalidate();let im=$('photo'),cv=document.createElement('canvas'),r=Math.min(1,160/Math.max(im.naturalWidth,im.naturalHeight));cv.width=Math.max(1,Math.round(im.naturalWidth*r));cv.height=Math.max(1,Math.round(im.naturalHeight*r));let ctx=cv.getContext('2d');ctx.drawImage(im,0,0,cv.width,cv.height);let a=ctx.getImageData(0,0,cv.width,cv.height).data,p=[];for(let i=0;i<a.length;i+=4)if(a[i+3]>128)p.push([a[i],a[i+1],a[i+2]]);if(!p.length){$('status').textContent='色を抽出できません';return}let c=[p[Math.floor(Math.random()*p.length)]];while(c.length<5){let w=p.map(x=>Math.min(...c.map(y=>dist(x,y)))),v=Math.random()*w.reduce((a,b)=>a+b,0),j=0;while(j<w.length-1&&v>w[j])v-=w[j++];c.push(p[j])}let counts;for(let t=0;t<20;t++){counts=c.map(()=>0);let sums=c.map(()=>[0,0,0]);for(let x of p){let k=0;for(let j=1;j<5;j++)if(dist(x,c[j])<dist(x,c[k]))k=j;counts[k]++;x.forEach((v,j)=>sums[k][j]+=v)}c=c.map((x,i)=>counts[i]?sums[i].map(v=>v/counts[i]):x)}colors=c.map((x,i)=>({ ...color(hex(x)),count:counts[i]})).sort((a,b)=>b.count-a.count);render();$('status').textContent='5色を抽出しました。'}$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;let u=URL.createObjectURL(f);$('photo').onload=()=>{URL.revokeObjectURL(u);$('photo').hidden=true;$('photo').hidden=false;$('empty').hidden=true;$('again').disabled=$('save').disabled=false;extract()};$('photo').onerror=()=>{URL.revokeObjectURL(u);$('status').textContent='JPEGまたはPNGをお試しください。'};$('photo').src=u};$('again').onclick=extract;$('save').onclick=()=>{let cv=document.createElement('canvas');cv.width=1080;cv.height=1440;let ctx=cv.getContext('2d'),im=$('photo');ctx.fillStyle='#f8f5ed';ctx.fillRect(0,0,1080,1440);let r=Math.min(960/im.naturalWidth,750/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;ctx.drawImage(im,(1080-w)/2,60+(750-h)/2,w,h);ctx.fillStyle='#44463f';ctx.font='56px serif';ctx.fillText($('date').textContent,60,890);ctx.font='26px Georgia';ctx.fillText('Colors of the day',60,935);colors.forEach((c,i)=>{let x=60+i*195;ctx.fillStyle=c.h;ctx.fillRect(x,985,180,235);ctx.fillStyle='#44463f';ctx.font='25px serif';ctx.fillText(c.n,x,1260,180);ctx.font='19px Georgia';ctx.fillText(c.e,x,1290,180);ctx.fillText(c.h,x,1320)});ctx.font='20px Georgia';ctx.textAlign='right';ctx.fillText('IRO NO SHIORI',1020,1390);cv.toBlob(b=>{if(!b)return;blob=b;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);$('output').src=url;$('output').hidden=$('share').hidden=$('download').hidden=false;$('download').href=url;$('status').textContent='完成画像を長押しするか、共有ボタンを押してください。'},'image/png')};$('share').onclick=async()=>{if(!blob)return;let f=new File([blob],'iro-no-shiori.png',{type:'image/png'});try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]});else $('status').textContent='共有非対応です。完成画像を長押しするかPNGをダウンロードしてください。'}catch(e){if(e.name!=='AbortError')$('status').textContent='共有できませんでした。画像の長押しをお試しください。'}};render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
